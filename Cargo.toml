[package]
name = "gdget"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Install pinned Godot addon dependencies from a committed manifest"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
