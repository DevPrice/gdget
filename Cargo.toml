[package]
name = "gdget"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Install pinned Godot addon dependencies from a committed manifest"
license = "MIT"
publish = false
repository = "https://github.com/DevPrice/gdget"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
toml_edit = "0.25.15"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tiny_http = "0.12.0"

[lints.rust]
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dev-dependencies]
libloading = "0.9.0"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
